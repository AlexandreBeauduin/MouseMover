name: MouseMover

options:
  bundleIdPrefix: io.github.alexandrebeauduin
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MouseMoverCore:
    type: framework
    platform: macOS
    sources:
      - Sources/MouseMoverCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexandrebeauduin.MouseMoverCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  MouseMover:
    type: application
    platform: macOS
    sources:
      - Sources/MouseMover
    dependencies:
      - target: MouseMoverCore
        embed: true
      - sdk: AppIntents.framework
    info:
      path: Sources/MouseMover/Info.plist
      properties:
        CFBundleName: MouseMover
        CFBundleDisplayName: MouseMover
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, nl, de]
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Alexandre Beauduin — MIT License"
    settings:
      base:
        PRODUCT_NAME: MouseMover
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexandrebeauduin.MouseMover
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_INTENTS_METADATA_GENERATION: YES

  MouseMoverCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/MouseMoverCoreTests
    dependencies:
      - target: MouseMoverCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexandrebeauduin.MouseMoverCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MouseMover:
    build:
      targets:
        MouseMover: all
        MouseMoverCoreTests: [test]
    test:
      targets:
        - MouseMoverCoreTests
