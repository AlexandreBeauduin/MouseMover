name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Xcode version
        run: xcodebuild -version
      - name: Tests
        run: scripts/test.sh
      - name: Build universal app
        run: scripts/build-app.sh
